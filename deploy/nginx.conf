# Cache-Control por rota. Fica fora do server porque `add_header` dentro de um
# location descarta TODOS os add_header herdados do server — usando um map, todos
# os add_header ficam num unico nivel.
map $uri $cache_control {
    default                "public, max-age=300, must-revalidate";
    ~^/assets/             "public, max-age=31536000, immutable";
    /favicon.svg           "public, max-age=604800";
    /site.webmanifest      "public, max-age=604800";
    /robots.txt            "public, max-age=86400";
    /sitemap.xml           "public, max-age=86400";
}

# X-Robots-Tag por host, em lista de permissao invertida: SO os dominios de
# producao ficam indexaveis; qualquer outro host (hom.*, IP, dominio novo)
# recebe noindex. Escolhido nesse sentido de proposito — se um dia alguem
# apontar hom.* para o container de producao, ou publicar um dominio novo sem
# avisar, o pior caso e "nao indexou ainda", nao "indexou o ambiente errado".
#
# Esta e a 3a camada de protecao (1: Basic Auth no Traefik, 2: meta robots do
# build, 4: robots.txt). Ao contrario do meta, o header vale tambem para .webp,
# .xml e qualquer outro arquivo servido daqui.
#
# nginx omite o add_header quando o valor resolve para string vazia — e assim
# que producao fica sem o header, sem precisar de um segundo server block.
map $host $robots_tag {
    default                      "noindex, nofollow, noarchive, nosnippet";
    drclaudiamaciel.com.br       "";
    www.drclaudiamaciel.com.br   "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # O Traefik roda em network_mode: host e faz proxy para 127.0.0.1,
    # entao o IP real da visitante vem no X-Forwarded-For.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # .webp ja e comprimido: gzipar so gasta CPU.
    gzip_types text/plain text/css text/xml application/xml application/json
               application/manifest+json image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Robots-Tag $robots_tag always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Um bloco `types` aqui substituiria o mime.types herdado inteiro, entao o
    # Content-Type do manifest e ajustado pontualmente por location.
    location = /site.webmanifest {
        default_type application/manifest+json;
        access_log off;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt   { access_log off; }
    location = /sitemap.xml  { access_log off; }
    location = /favicon.svg  { access_log off; }

    # /favicon.ico e pedido automaticamente pelos navegadores; sem esta regra
    # cada visita gera um 404 no log de acesso.
    location = /favicon.ico {
        access_log off;
        return 301 /favicon.svg;
    }

    # Site de pagina unica: SO a raiz devolve o index. Qualquer outra URL cai em
    # 404 de verdade — devolver o index com status 200 em URLs inexistentes gera
    # "soft 404", que o Google trata como erro de qualidade e pode desindexar.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        access_log off;
    }
}
