# Cache-Control por rota. Fica fora do server porque `add_header` dentro de um
# location descarta TODOS os add_header herdados do server — usando um map, todos
# os add_header ficam num unico nivel.
map $uri $cache_control {
    default        "public, max-age=300, must-revalidate";
    /robots.txt    "public, max-age=86400";
    /sitemap.xml   "public, max-age=86400";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # O Traefik roda em network_mode: host e faz proxy para 127.0.0.1,
    # entao o IP real da visitante vem no X-Forwarded-For.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/json image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        access_log off;
    }

    location = /sitemap.xml {
        access_log off;
    }

    # Site de pagina unica: qualquer rota cai no index.html.
    location / {
        try_files $uri /index.html;
    }
}
